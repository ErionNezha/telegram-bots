services:
  - type: web
    name: telegram-bots
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python supervisor.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: TELEGRAM_TOKEN
        sync: false
      - key: DERTLI_TG_TOKEN
        sync: false
      - key: SUPPORT_BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        value: "1318275745"
